apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-backoffice
  namespace: x-platform
  labels:
    app: x-backoffice
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: x-backoffice
  template:
    metadata:
      labels:
        app: x-backoffice
    spec:
      automountServiceAccountToken: false
      containers:
        - name: x-backoffice
          image: ghcr.io/sieng-vathana/x-backoffice:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: x-backoffice
  namespace: x-platform
spec:
  selector:
    app: x-backoffice
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: x-backoffice
  namespace: x-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.learner-teach.online
      secretName: x-backoffice-admin-tls
  rules:
    - host: admin.learner-teach.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: x-backoffice
                port:
                  number: 80
